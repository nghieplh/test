<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        font-family: Arial, sans-serif;
      }

      .login-box {
        width: 100%;
        max-width: 380px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 24px;
        color: #333;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #444;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #dcdfe6;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s ease;
      }

      input:focus {
        border-color: #667eea;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        padding: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>Đăng nhập</h2>
      <form>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Nhập username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Nhập password" />
        </div>

        <button type="submit">Đăng nhập</button>
      </form>
    </div>
  </body>
</html>
