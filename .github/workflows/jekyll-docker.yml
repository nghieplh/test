name: Jekyll Lint & Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  jekyll-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # Adjust to match your project's Ruby version
          bundler-cache: true # Automatically runs 'bundle install' and caches gems

      - name: Build Jekyll Site
        run: |
          bundle exec jekyll build --strict --trace
        env:
          JEKYLL_ENV: production

      - name: Lint HTML and Check Links
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external=true \
            --check-html \
            --allow-hash-href
